<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <h1>Minhas tarefas</h1>

    <div class="entrada">
      <input id="task" placeholder="Digite uma tarefa..." aria-label="Nova tarefa" autocomplete="off">
      <button class="btn-add" onclick="add()">Adicionar</button>
    </div>

    <ul id="list"></ul>
  </main>

  <script src="script.js"></script>
</body>

</html>
